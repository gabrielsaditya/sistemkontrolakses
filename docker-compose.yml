version: '3.8'

services:
    postgres:
        image: postgres:16-alpine
        container_name: database
        restart: always
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
            POSTGRES_DB: db_project
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data 
        
    backend:
        build: . 
        container_name: backend
        restart: always 
        ports:
            - "8000:8000"
        environment:
            - DATABASE_URL=postgresql+psycopg://admin:admin123@postgres:5432/gatekeeper_db
        volumes:
            - ./uploads:/workspace/uploads
        depends_on:
            - postgres

volumes:
    postgres_data: